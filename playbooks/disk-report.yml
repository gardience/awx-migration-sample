# Read-only: reports root file system use and fails above a threshold.
- name: Disk report
  hosts: all
  gather_facts: true
  vars:
    max_percent: 90
  tasks:
    - name: Find the root file system
      ansible.builtin.set_fact:
        root_fs: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | first | default({}) }}"

    - name: Root file system use
      when: root_fs.size_total is defined
      vars:
        used: "{{ (100 * (1 - root_fs.size_available / root_fs.size_total)) | round(1) }}"
      ansible.builtin.assert:
        that: used | float < max_percent | float
        success_msg: "/ is {{ used }}% full"
        fail_msg: "/ is {{ used }}% full, above {{ max_percent }}%"

    - name: No root file system reported (containers report none)
      when: root_fs.size_total is not defined
      ansible.builtin.debug:
        msg: "This machine reports no root file system, so there is nothing to check."
